<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTBMusic – Lyrics Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111;
    padding: 32px 40px;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 40px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 54px; height: 54px; }
  .brand-text { line-height: 1.05; }
  .brand-text .name { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .brand-text .tag  { font-size: 15px; font-weight: 400; margin-left: 10px; }

  /* ---------- Settings ---------- */
  .settings {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .settings label { font-size: 13px; font-weight: 600; }
  .settings input, .settings select {
    padding: 8px 12px;
    border: 1.5px solid #111;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    background: #fff;
  }
  .settings input { width: 300px; }
  .settings input:focus, .settings select:focus { border-color: #e03c31; }
  .settings a { font-size: 12px; color: #e03c31; }

  /* ---------- Panels ---------- */
  .panels {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: stretch;
  }
  .panel {
    width: 360px;
    max-width: 100%;
    border: 1.5px solid #111;
    border-radius: 14px;
    padding: 18px 18px 22px;
    display: flex;
    flex-direction: column;
    min-height: 650px;
    background: #fff;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }
  .panel-head h2 {
    white-space: nowrap;
    margin-right: 10px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .actions { display: flex; gap: 8px; }

  /* ---------- Buttons ---------- */
  .btn {
    border: 1.5px solid #111;
    border-radius: 7px;
    padding: 5px 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .08s, filter .15s;
    font-family: inherit;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:active { transform: scale(0.97); }
  .btn-yellow { background: #fdc500; color: #111; }
  .btn-red    { background: #f32735; color: #fff; }

  .generate {
    margin: 22px auto 0;
    background: #d9372b;
    color: #fff;
    border: 1.5px solid #111;
    border-radius: 999px;
    padding: 13px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform .08s, filter .15s;
    font-family: inherit;
  }
  .generate:hover { filter: brightness(1.08); }
  .generate:active { transform: scale(0.97); }
  .generate:disabled { opacity: .6; cursor: not-allowed; }
  .generate .plus { font-size: 20px; line-height: 1; font-weight: 400; }

  /* ---------- Text areas ---------- */
  textarea {
    flex: 1;
    width: 100%;
    border: 1.5px solid #111;
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    font-family: inherit;
    background: #fff;
    color: #111;
  }
  textarea:focus { border-color: #e03c31; }
  textarea::placeholder { color: #aaa; }

  /* ---------- Status ---------- */
  .status {
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
    color: #666;
  }
  .status.error { color: #e03c31; font-weight: 600; }
  .status.ok    { color: #1f8f3a; font-weight: 600; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .generate.loading .spinner { display: inline-block; }
  .generate.loading .plus { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- SEO panel ---------- */
  .panel-seo { gap: 0; }
  .panel-seo .panel-head { margin-bottom: 22px; }
  .seo-box {
    border: 1.5px solid #111;
    border-radius: 12px;
    padding: 14px 14px 16px;
    margin-bottom: 16px;
  }
  .seo-box h3 { font-size: 14px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.2px; }
  .seo-item {
    position: relative;
    border: 1.5px solid #111;
    border-radius: 10px;
    margin-bottom: 10px;
    background: #fff;
  }
  .seo-item:last-child { margin-bottom: 0; }
  .seo-item input, .seo-item textarea {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 10px 76px 10px 12px;
    font-size: 13px;
    line-height: 1.45;
    font-family: inherit;
    background: transparent;
    outline: none;
    resize: none;
    color: #111;
    display: block;
    min-height: 0;
    flex: none;
  }
  .seo-item input { height: 40px; }
  .seo-item.tall textarea { height: 118px; padding-top: 12px; }
  .seo-item .btn-sm {
    position: absolute;
    top: 7px;
    right: 8px;
    padding: 4px 16px;
    font-size: 11px;
  }
  .btn-sm { padding: 4px 14px; font-size: 11px; }

  /* ---------- Tools panel ---------- */
  .panel-tools { width: 260px; min-height: 0; align-self: flex-start; }
  .panel-tools .panel-head { margin-bottom: 18px; }
  .tool-link {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid #111;
    border-radius: 12px;
    padding: 12px 12px 12px 12px;
    margin-bottom: 12px;
    text-decoration: none;
    color: #111;
    background: #fff;
    transition: transform .08s, background .15s, box-shadow .15s;
  }
  .tool-link:last-child { margin-bottom: 0; }
  .tool-link:hover { background: #fff7d6; box-shadow: 3px 3px 0 #111; transform: translate(-1px,-1px); }
  .tool-link:active { transform: translate(0,0); box-shadow: none; }
  .tool-icon {
    width: 40px; height: 40px; flex: none;
    border-radius: 10px;
    background: #fdc500;
    border: 1.5px solid #111;
    display: flex; align-items: center; justify-content: center;
  }
  .tool-icon svg { width: 20px; height: 20px; }
  .tool-link:nth-child(odd) .tool-icon { background: #f32735; color: #fff; }
  .tool-text { display: flex; flex-direction: column; line-height: 1.2; flex: 1; min-width: 0; }
  .tool-text b { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
  .tool-text small { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-arrow { font-size: 16px; font-weight: 700; color: #d9372b; }

  @media (max-width: 900px) {
    body { padding: 24px 18px; }
    .panel { width: 100%; min-height: 520px; }
    .panel-tools { min-height: 0; }
    .settings input { width: 100%; }
  }
</style>
</head>

      <div class="seo-item tall"><textarea id="prompt2" placeholder="Thumbnail prompt 2" readonly></textarea><button class="btn btn-yellow btn-sm copy-field" data-target="prompt2">Copy</button></div>

<script>
  const $ = (id) => document.getElementById(id);
  const apiKeyEl  = $('apiKey');
  const modelEl   = $('model');
  const refEl     = $('refLyrics');
  const genEl     = $('genLyrics');
  const statusEl  = $('status');
  const genBtn    = $('generateBtn');

  // ---- Remember key & model locally (only in this browser) ----
  apiKeyEl.value = localStorage.getItem('ytb_gemini_key') || '';
  const DEFAULT_MODEL = 'gemini-3.5-flash-lite';
  const savedModel = localStorage.getItem('ytb_gemini_model');
  const validModels = [...modelEl.options].map(o => o.value);
  modelEl.value = validModels.includes(savedModel) ? savedModel : DEFAULT_MODEL;
  localStorage.setItem('ytb_gemini_model', modelEl.value);
  apiKeyEl.addEventListener('input', () => localStorage.setItem('ytb_gemini_key', apiKeyEl.value.trim()));
  modelEl.addEventListener('change', () => localStorage.setItem('ytb_gemini_model', modelEl.value));

  function setStatus(msg, type = '') {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + type;
  }


  // ---- Paste ----
  $('pasteBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      refEl.value = text;
      setStatus('Pasted.', 'ok');
    } catch {
      refEl.focus();
      setStatus('Clipboard blocked by browser – press Ctrl+V inside the box.', 'error');
    }
  });

  // ---- Clear ----
  $('clearBtn').addEventListener('click', () => {
    refEl.value = '';
    setStatus('');
    refEl.focus();
  });

  // ---- Copy ----
  $('copyBtn').addEventListener('click', async () => {
    if (!genEl.value.trim()) return;
    try {
      await navigator.clipboard.writeText(genEl.value);
      const b = $('copyBtn'); const old = b.textContent;
      b.textContent = 'Copied!';
      setTimeout(() => (b.textContent = old), 1200);
    } catch {
      genEl.select(); document.execCommand('copy');
    }
  });

  // ---- Prompt ----
  function buildPrompt(reference) {
    return `ROLE: You are a top-tier US professional songwriter / ghostwriter with 20+ years of experience writing for major American pop, R&B, hip-hop, country and rock artists. You write at a Grammy-level standard. You deliver lyrics only — never commentary.

YOUR TASK:
You will receive REFERENCE LYRICS. Produce a NEW VERSION of this song that is a LINE-BY-LINE PARAPHRASE: EXACTLY the same story, the same meaning, the same emotion, the same hook idea and the same structure — only the WORDS change.
Think of it as a translation of the song into "other English words": line 1 of your song says what line 1 of the reference says, line 2 says what line 2 says, and so on. Anyone who hears both must feel "this is the same song / same message", but the sentences are written differently.
THE #1 PRIORITY IS KEEPING THE MEANING OF EVERY LINE. Changing the words is the method, not the goal. Never sacrifice the meaning to be more original.

STRICT RULES:
1. SAME MEANING, LINE BY LINE — This is the most important rule. Go through the reference LINE BY LINE and paraphrase each line keeping the SAME meaning, the SAME image and the SAME emotional beat (if the reference line talks about a phone call, your line talks about a phone call; if it says "I'm not good with words", your line says the same idea with other words). Do NOT invent a different story, new scenes, new characters or a different topic. Do NOT add ideas that are not in the reference. Do NOT drift away.
2. THE CHORUS AND THE HOOK ARE REWRITTEN TOO — The chorus keeps the same core message, but EVERY line of it is paraphrased like the verses, INCLUDING THE HOOK. The hook must say the same thing with different words and still be catchy and repeated the same number of times (e.g. "I love you like that" → "That's the way I love you" / "Love you just like this"; "nothing else matters" → "nothing else counts" / "the rest don't matter"; "steal the night" → "take the dark"). NEVER keep the reference hook or any reference line word-for-word: the lyrics will be checked by an automatic copyright filter (Suno) that rejects any sentence matching a known song. Copying the hook or the chorus is the worst possible mistake.
3. CHANGE THE WORDING, NOT THE MEANING (COPYRIGHT RULE) — Do NOT copy a full line or any sequence of 3 or more consecutive meaningful words from the reference (tiny function-word groups like "in the", "I don't" are fine). This applies to EVERY section, including the [Chorus], the [Outro] and the [Bridge] — paraphrase them like the verses, never paste them. Use synonyms, change the word order, swap the rhyme words, re-phrase the sentence — but the line must still say THE SAME THING. Small images may be adjusted only when needed for the rhyme, and they must stay inside the same scene and meaning.
4. SAME STRUCTURE — Same sections, same order, same number of sections ([Verse 1], [Chorus], [Verse 2], [Bridge], [Outro]…). You MAY add a short 2-line [Pre-Chorus] before each chorus if it helps the flow. Repeated choruses must be identical to each other. And the sentences should not be too long.
5. SAME LENGTH & FLOW — Each section must have the same number of lines as the reference and a very similar syllable count per line, so it can be sung on the same melody and beat.
6. HEAVY RHYME — Write in strong rhyming couplets (AABB) or ABAB. Every line should end on a clean rhyme and feel singable. Use internal rhymes when natural.
7. EMOTION — Keep the feelings vivid: love, longing, pain, hope, regret… the same emotions as the reference, expressed professionally.
8. PROFESSIONAL QUALITY — Major-label level: tight phrasing, natural English, no filler, no clichés piled up, no awkward grammar.
8b. AD-LIBS & VOCAL FILLS — Like a real recorded song, sprinkle tasteful ad-libs in parentheses where they feel natural: (Mmm), (Oh-oh), (Ooh), (Yeah), (Hey), (Uh-huh), (Oh, oh, oh), (Na-na-na), (Woah)… Use them in the [Intro], at the end of some chorus lines, in the [Bridge] and in the [Outro] — about 4 to 8 ad-libs in the whole song, never on every line. They must fit the mood (soft "Mmm / Ooh" for love songs, energetic "Yeah / Hey / Uh" for rap or upbeat songs).
9. LYRICS ONLY — Your entire output is the song and nothing else.

EXAMPLE OF THE EXPECTED CLOSENESS (reference line → rewritten line):
"You hate that I usually don't open up" → "Never good at saying what I feel inside."
"I know when I say it, it doesn't say enough" → "Nowhere left to run, nowhere left to hide."
"With you close, I'm the happiest I ever was" → "When you're right beside me, world is fading slow."
"But I see myself next to you until we're old" → "Picture us together till we're grey and old."
Reference chorus hook "I got the real thing / nothin' else matters / I love you like that" → "Yeah, we found that real, undeniable thing. Nothing else counts when I hear you sing. That's the way I love you, that's the way I love you."
BAD EXAMPLE (NOT ALLOWED): reference outro "Every moment that I steal... Making every feeling real." → output "Every moment that I steal... Making every feeling real." ← this is a copy. Correct: "Every second that I take (mmm)... Turning all the fake to real."
Example of ad-libs done right: "[Intro] (Mmm, yeah) Oh-oh..." / "[Chorus] ... I love you like that (oh-oh)" / "[Outro] (Yeah, yeah) Till the morning comes around (mmm)..." 

OUTPUT FORMAT (VERY IMPORTANT):
- First line exactly: [Musica] ...
- Then one paragraph per section. Each paragraph starts with the section tag followed by the lines of that section written as sentences on the same line, separated by periods, commas or exclamation marks. Example:
[Verse 1] First line of the verse. Second line of the verse. Third line of the verse.
[Chorus] First line. Second line. Third line!
- One empty line between sections.
- NO title, NO introduction, NO explanations, NO notes, NO comments, NO encouragement, NO closing line to the user.
- Nothing before "[Musica] ..." and nothing after the last lyric line. The output is copied directly into a music generator.

REFERENCE LYRICS:
"""
${reference}
"""`;
  }

  // ---- Clean output: keep ONLY the lyrics (remove any intro/outro notes from the AI) ----
  function cleanLyrics(raw) {
    let t = raw.replace(/```[a-z]*\n?/gi, '').trim();

    // 1) Drop anything before the first section tag like [Intro] / [Verse 1]
    const firstTag = t.search(/\[[^\]\n]{1,40}\]/);
    if (firstTag > 0) t = t.slice(firstTag);

    // 2) Split into paragraphs; drop trailing paragraphs that look like notes to the user
    const notePattern = /\b(keep (writing|going|creating|pushing|shining)|good luck|hope (this|these|you) (help|like|enjoy|find)|feel free to|let me know|note:|happy (writing|creating|recording)|the world needs your voice|every great song (starts|begins)|here (is|are) (your|the) (song|lyrics)|i hope)\b/i;
    const blocks = t.split(/\n\s*\n/);
    while (blocks.length > 1) {
      const last = blocks[blocks.length - 1].trim();
      const hasTag = /^\[[^\]\n]+\]/.test(last);
      if (!hasTag && notePattern.test(last)) { blocks.pop(); continue; }
      break;
    }
    t = blocks.join('\n\n');

    // 3) Remove a single trailing note line inside the last block
    const lines = t.split('\n');
    while (lines.length > 1) {
      const last = lines[lines.length - 1].trim();
      if (last === '' ) { lines.pop(); continue; }
      if (!/^\[/.test(last) && notePattern.test(last)) { lines.pop(); continue; }
      break;
    }
    return lines.join('\n').trim();
  }

  // ---- Anti-copy helpers ----
  function normalizeWords(str) {
    return str.toLowerCase()
      .replace(/\([^)]*\)/g, ' ')           // drop (ad-libs)
      .replace(/\[[^\]]*\]/g, ' ')          // drop [tags]
      .replace(/[’']/g, "'")
      .replace(/[^a-z0-9' ]+/g, ' ')
      .split(/\s+/).filter(Boolean);
  }
  function splitSegments(str) {
    return str
      .replace(/\[[^\]]*\]/g, '\n')
      .split(/\n|(?<=[.!?…])\s+|\.\.\.\s*/)
      .map(x => x.trim())
      .filter(x => normalizeWords(x).length >= 4);
  }
  function ngramCounts(words, n) {
    const out = new Map();
    for (let i = 0; i + n <= words.length; i++) {
      const g = words.slice(i, i + n).join(' ');
      out.set(g, (out.get(g) || 0) + 1);
    }
    return out;
  }
  // Suno-safe copy check. A generated segment is flagged when it shares with the reference:
  //  - any 4 consecutive words, OR
  //  - any 3 consecutive words of which at least 2 are "meaningful" (not tiny function words).
  // There is NO hook exception any more: Suno's filter catches the hook first.
  const STOP = new Set(('i you me my your we us our he she they them it its the a an to and or but of in on at for with from by as is am are was were be been do does did dont don\'t not no so if that this these those there here when what how why who oh yeah ooh mmm hey uh na la woah like just all up down out off').split(' '));
  function findCopiedLines(generated, reference) {
    const refWords = normalizeWords(reference);
    const ref4 = ngramCounts(refWords, 4);
    const ref3 = ngramCounts(refWords, 3);
    const meaningful = g => g.split(' ').filter(x => !STOP.has(x)).length >= 2;
    const hits = [];
    for (const seg of splitSegments(generated)) {
      const w = normalizeWords(seg);
      let bad = false;
      for (const g of ngramCounts(w, 4).keys()) { if (ref4.has(g)) { bad = true; break; } }
      if (!bad) for (const g of ngramCounts(w, 3).keys()) { if (ref3.has(g) && meaningful(g)) { bad = true; break; } }
      if (bad) hits.push(seg);
    }
    return [...new Set(hits)];
  }
  function buildFixPrompt(copiedLines, reference) {
    return `You are a top-tier US professional songwriter. The lines below come from a NEW SONG that paraphrases a REFERENCE song, but a copyright check found they are still too close to the reference (they share consecutive words with it). The lyrics will be submitted to Suno, whose copyright filter rejects any sentence matching a known song.

LINES TO FIX:
${copiedLines.map((l, i) => `${i + 1}. "${l}"`).join('\n')}

For EACH line, write ONE replacement line that:
- says EXACTLY the same thing (same meaning, same image, same emotion) with different words;
- has the same number of syllables and ends with a word that rhymes with the original line's last word (or a very close rhyme), so it still fits the melody and the neighbouring rhymes;
- shares NO sequence of 4+ consecutive words with the reference;
- may include a tasteful ad-lib in parentheses like (mmm), (oh-oh), (yeah) only if it fits.

Return ONLY valid JSON, nothing else, in this exact shape:
{"fixes":[{"old":"<line exactly as given>","new":"<replacement line>"}]}

REFERENCE (do not copy from it):
"""
${reference}
"""`;
  }
  function applyFixes(song, fixesJson, copiedLines) {
    let data;
    try { data = JSON.parse(fixesJson.replace(/```json|```/gi, '').trim()); }
    catch { const m = fixesJson.match(/\{[\s\S]*\}/); if (!m) return song; try { data = JSON.parse(m[0]); } catch { return song; } }
    const fixes = Array.isArray(data?.fixes) ? data.fixes : [];
    let out = song;
    fixes.forEach((f, i) => {
      const oldLine = (f.old || copiedLines[i] || '').toString().trim();
      const newLine = (f.new || '').toString().trim();
      if (!newLine) return;
      // match the exact segment, or fall back to the copied segment at the same index
      const target = out.includes(oldLine) ? oldLine : (copiedLines[i] && out.includes(copiedLines[i]) ? copiedLines[i] : null);
      if (target) out = out.split(target).join(newLine);
    });
    return out;
  }

  // ---- Shared Gemini call (with auto-fallback to the default model) ----
  async function askGemini(prompt, { json = false, statusFn = setStatus } = {}) {
    const key = apiKeyEl.value.trim();
    const generationConfig = { temperature: 0.8, maxOutputTokens: 8192 };
    if (json) generationConfig.responseMimeType = 'application/json';

    async function call(model) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig })
      });
      const data = await res.json();
      return { res, data };
    }

    let model = modelEl.value;
    let { res, data } = await call(model);

    if (!res.ok && model !== DEFAULT_MODEL && (res.status === 404 || /no longer available|not found|not supported/i.test(data?.error?.message || ''))) {
      statusFn(`${model} unavailable – retrying with ${DEFAULT_MODEL}...`);
      model = DEFAULT_MODEL;
      modelEl.value = DEFAULT_MODEL;
      localStorage.setItem('ytb_gemini_model', DEFAULT_MODEL);
      ({ res, data } = await call(model));
    }

    if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);

    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
    if (!text.trim()) {
      const reason = data?.candidates?.[0]?.finishReason || data?.promptFeedback?.blockReason || 'empty response';
      throw new Error('Empty response (' + reason + '). Try again or change model.');
    }
    return text;
  }

  // ---- Generate Lyrics ----
  genBtn.addEventListener('click', async () => {
    const key = apiKeyEl.value.trim();
    const reference = refEl.value.trim();

    if (!key) { setStatus('Please enter your Gemini API key (top right).', 'error'); apiKeyEl.focus(); return; }
    if (!reference) { setStatus('Paste some reference lyrics first.', 'error'); refEl.focus(); return; }

    genBtn.disabled = true;
    genBtn.classList.add('loading');
    genBtn.querySelector('.label').textContent = 'Generating...';
    setStatus('Writing your new song...');
    genEl.value = '';
    clearSeo();

    try {
      const text = await askGemini(buildPrompt(reference));
      let song = cleanLyrics(text);
      genEl.value = song;                      // show the draft right away

      // ---- Anti-copy check (single pass): rewrite only the copied lines ----
      let copied = findCopiedLines(song, reference);
      let seoPromise = null;
      if (!copied.length) {
        // nothing to fix → the song is final, build SEO right away
        seoPromise = generateSeo();
      } else {
        setStatus(`Fixing ${copied.length} line(s) too close to the original...`);
        try {
          const fixed = await askGemini(buildFixPrompt(copied, reference), { json: true });
          song = applyFixes(song, fixed, copied);
          genEl.value = song;
        } catch (e) { /* keep the draft */ }
        copied = findCopiedLines(song, reference);
        // SEO is built ONLY from the final song shown in "Generated Songs"
        seoPromise = generateSeo();
      }

      if (copied.length) {
        setStatus(`Done, but ${copied.length} line(s) are still close to the original – please check: "${copied[0].slice(0, 60)}..."`, 'error');
      } else {
        setStatus('Done! New original song generated – no copied lines.', 'ok');
      }
      await seoPromise;
    } catch (err) {
      setStatus('Error: ' + err.message, 'error');
    } finally {
      genBtn.disabled = false;
      genBtn.classList.remove('loading');
      genBtn.querySelector('.label').textContent = 'Generate Lyrics';
    }
  });

  // ---- Safer Rewrite: push the current song further away from the reference (for Suno's filter) ----
  const saferBtn = $('saferBtn');
  const genStatusEl = $('genStatus');
  function setGenStatus(msg, type = '') { genStatusEl.textContent = msg; genStatusEl.className = 'status ' + type; }

  function buildSaferPrompt(song, reference) {
    return `You are a top-tier US professional songwriter. The NEW SONG below is a paraphrase of a REFERENCE song, but Suno's automatic copyright filter still rejected it as "copyrighted material".

Rewrite the NEW SONG so it is CLEARLY DIFFERENT from the reference in wording while keeping the same story, meaning, emotion, structure and flow:
- Re-phrase the HOOK with new words (same idea), and change the rhyme words of every line.
- No sentence may share 3 or more consecutive meaningful words with the reference. Change word order, use synonyms, new but equivalent images inside the same scene.
- Keep the same sections, the same number of lines per section and similar syllable counts so it still fits the melody.
- Keep tasteful ad-libs in parentheses like (mmm), (oh-oh), (yeah).
- Same output format: first line "[Musica] ...", one paragraph per section starting with its tag, lines separated by periods. Output ONLY the song, nothing else.

NEW SONG:
"""
${song}
"""

REFERENCE (do not copy from it):
"""
${reference}
"""`;
  }

  saferBtn.addEventListener('click', async () => {
    const song = genEl.value.trim();
    const reference = refEl.value.trim();
    if (!apiKeyEl.value.trim()) { setGenStatus('Enter your Gemini API key first.', 'error'); return; }
    if (!song) { setGenStatus('Generate a song first.', 'error'); return; }
    saferBtn.disabled = true; saferBtn.textContent = 'Rewriting...';
    setGenStatus('Rewriting further away from the original...');
    try {
      let newSong = cleanLyrics(await askGemini(buildSaferPrompt(song, reference || song), { statusFn: setGenStatus }));
      if (!/\[[^\]]+\]/.test(newSong)) throw new Error('Unexpected answer, try again.');
      let copied = reference ? findCopiedLines(newSong, reference) : [];
      if (copied.length) {
        setGenStatus(`Fixing ${copied.length} line(s)...`);
        try {
          const fixed = await askGemini(buildFixPrompt(copied, reference), { json: true, statusFn: setGenStatus });
          newSong = applyFixes(newSong, fixed, copied);
        } catch {}
        copied = findCopiedLines(newSong, reference);
      }
      genEl.value = newSong;
      setGenStatus(copied.length ? `Rewritten – ${copied.length} line(s) still close, check them or click again.` : 'Rewritten – safer version ready. Regenerate SEO if needed.', copied.length ? 'error' : 'ok');
    } catch (err) {
      setGenStatus('Error: ' + err.message, 'error');
    } finally {
      saferBtn.disabled = false; saferBtn.textContent = 'Safer Rewrite';
    }
  });

  // =====================================================================
  //  SEO : 3 titles + 3 thumbnail prompts
  // =====================================================================
  const seoStatusEl = $('seoStatus');
  const seoBtn = $('seoBtn');
  const seoFields = ['title1','title2','title3','prompt1','prompt2','prompt3'];

  function setSeoStatus(msg, type = '') {
    seoStatusEl.textContent = msg;
    seoStatusEl.className = 'status ' + type;
  }
  function clearSeo() {
    seoFields.forEach(id => ($(id).value = ''));
    setSeoStatus('');
  }

  function buildSeoPrompt(lyrics) {
    return `You are a YouTube music-channel growth expert and a senior music-video cinematographer / art director who writes image-generation prompts for photorealistic artist thumbnails.

Read the SONG LYRICS below, understand the story, mood, genre and vibe, then produce:

A) 3 TITLES
- 3 different, strong, SEO-friendly YouTube titles that express the vibe of THIS song.
- SHORT and simple: 2 to 6 words. Each title MUST be built from words or phrases that actually appear in the SONG LYRICS below (the hook, a repeated phrase, or the strongest image). Do not invent titles that are not in these lyrics.
- Title case. No hashtags, no quotes, no emojis, no genre tags, no "|" or "-" suffixes, no "(Official Video)".
- Example style: "Love You Like That", "Nothing Else Matters", "Until We're Grey and Old".

B) 3 THUMBNAIL PROMPTS
- 3 ultra-photorealistic, very detailed image-generation prompts, each 120–180 words, written as ONE dense paragraph (like a real music video still description).
- Always call the subject "the provided artist character" (never "man", "woman", "male", "female", "girl", "boy", "he", "she" — NO gender words at all).
- The scenes, mood and details must come from the story told in the SONG LYRICS below (THIS song, not a generic song).
- Each prompt is a DIFFERENT SCENE that fits THIS song's story and emotion:
  • Prompt 1: tight medium close-up / close-up, face sharply focused and prominent. Eyes either in direct eye contact with the camera or looking slightly off-camera with a clear emotion (thoughtful, vulnerable, hopeful, hurt…).
  • Prompt 2: medium shot that feels like a music video frame — e.g. beside a rain-covered window, inside a car, in a studio, on a rooftop, in a hallway… The character does NOT need to look at the camera.
  • Prompt 3: wide shot like a music video still — e.g. empty city street at 2 a.m., rooftop over the night city, highway, desert, beach, forest… The character stays clearly recognizable and remains the main subject.
- Every prompt must describe, concretely: the location and time, the pose and the facial expression linked to the song's emotion, clothing (simple, realistic), lighting (practical lights, low-key, cold blue / warm amber, streetlamp, golden hour…), shadows and reflections, color palette, lens (e.g. 85mm f/1.8, 50mm, 35mm), depth of field, film grain / high-ISO texture, natural skin texture and imperfections, "cinematic but not stylized", believable live-action camera photography.
- Thumbnails must be cinematic, realistic, moody and attractive to click.
- Every prompt MUST end with: "no other people, no text, no logos, no microphone, no CGI, no beauty-filter look".

EXAMPLE OF THE EXPECTED PROMPT QUALITY:
"Extremely photorealistic music video still, tight medium close-up of the provided artist character inside a dimly lit upscale bar at midnight, sitting near the bar counter with a thoughtful, emotionally honest expression, eyes looking slightly off-camera as if thinking about someone deeply loved. Very low-key lighting, deep shadows across part of the face, subtle reflections from muted blue and amber practical lights, realistic dark background with softly blurred bottles and furniture, natural skin pores, authentic facial texture, realistic eyes, imperfect natural lighting, shot on an 85mm lens at f/1.8, subtle high-ISO film grain, cinematic contrast without excessive color grading, believable full-frame camera photography, face sharply focused and prominent in frame, no other people, no text, no logos, no microphone, no CGI, no beauty-filter look."

Return ONLY valid JSON in exactly this shape, nothing else:
{"titles":["...","...","..."],"prompts":["...","...","..."]}

SONG LYRICS:
"""
${lyrics}
"""`;
  }

  function parseSeo(text) {
    let t = text.replace(/```json|```/gi, '').trim();
    try { return JSON.parse(t); } catch {}
    const m = t.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch {} }
    throw new Error('Could not read SEO data. Try again.');
  }

  async function generateSeo() {
    const lyrics = genEl.value.trim();
    if (!apiKeyEl.value.trim()) { setSeoStatus('Enter your Gemini API key first.', 'error'); return; }
    if (!lyrics) { setSeoStatus('Generate a song first.', 'error'); return; }

    seoBtn.disabled = true;
    seoBtn.textContent = 'Working...';
    setSeoStatus('Creating titles & thumbnail prompts...');

    try {
      const text = await askGemini(buildSeoPrompt(lyrics), { json: true, statusFn: setSeoStatus });
      const seo = parseSeo(text);
      const titles = Array.isArray(seo.titles) ? seo.titles : [];
      const prompts = Array.isArray(seo.prompts) ? seo.prompts : [];
      for (let i = 0; i < 3; i++) {
        $('title' + (i + 1)).value = (titles[i] || '').toString().trim();
        $('prompt' + (i + 1)).value = (prompts[i] || '').toString().trim();
      }
      setSeoStatus('SEO ready!', 'ok');
    } catch (err) {
      setSeoStatus('Error: ' + err.message, 'error');
    } finally {
      seoBtn.disabled = false;
      seoBtn.textContent = 'Generate SEO';
    }
  }
  seoBtn.addEventListener('click', generateSeo);

  // If the user edits the generated song by hand, remind them SEO can be refreshed from it
  genEl.addEventListener('input', () => {
    if (seoFields.some(id => $(id).value.trim())) setSeoStatus('Lyrics edited – click "Generate SEO" to refresh titles & prompts.');
  });

  // Copy buttons for each SEO field
  document.querySelectorAll('.copy-field').forEach(btn => {
    btn.addEventListener('click', async () => {
      const el = $(btn.dataset.target);
      if (!el.value.trim()) return;
      try { await navigator.clipboard.writeText(el.value); }
      catch { el.select(); document.execCommand('copy'); }
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => (btn.textContent = old), 1200);
    });
  });

  // Ctrl+Enter shortcut
  refEl.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') genBtn.click();
  });
</script>
</body>
</html>
